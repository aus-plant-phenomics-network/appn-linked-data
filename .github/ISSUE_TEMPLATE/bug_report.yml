name: Bug report
description: Something behaves incorrectly
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not include credentials, tokens or
        embargoed research data in this issue — it may be public.

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: What did you observe, and what did you expect instead?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Exact commands or input. A minimal reproduction is worth ten paragraphs.
      placeholder: |
        1. Run `...`
        2. With input `...`
        3. Observe `...`
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      description: Paste the relevant output. Redact any credentials first.
      render: shell

  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag, or commit SHA if running from a branch.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, runtime version, and whether this is local, staging or production.
      placeholder: "macOS 15.3, Python 3.12.8, local"
    validations:
      required: true

  - type: dropdown
    id: impact
    attributes:
      label: Impact
      options:
        - Blocks a production service or pipeline
        - Produces incorrect data or results
        - Blocks local development
        - Minor or cosmetic
    validations:
      required: true
