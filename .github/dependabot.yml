# Dependabot must be enabled on every repository — security AND version
# updates (§3.8). Uncomment the ecosystems this repository actually uses.
#
# Triage: security alerts within one week; critical severity on deployed
# services within 48 hours.
version: 2
updates:
  # GitHub Actions — applies to every repository.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"

  # Python
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
    groups:
      dev-dependencies:
        patterns: ["pytest*", "ruff", "black", "mypy", "types-*"]

