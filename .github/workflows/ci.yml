# Minimum CI pipeline (§3.11):
#   lint → format check → type check → unit tests → integration tests → build → security scan
#
# Every step here maps to a Makefile target, so a developer reproduces CI with
# `make check` and the two cannot drift.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege at the workflow level; widen per job, never here (§3.11).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, type check and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Matrix across every version the project claims to support (§3.11).
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38  # v5.4.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check --output-format=github .

      - name: Format check
        # Switch to `black --check .` if this repository formats with Black.
        run: ruff format --check .

      - name: Type check
        run: mypy src tests

      - name: Test
        run: pytest -m "not integration" --cov=src --cov-report=term-missing --cov-report=xml

      - name: Publish coverage to the job summary
        # Reviewers should see results without opening logs (§3.11).
        if: always()
        run: |
          {
            echo "### Coverage (Python ${PYTHON_VERSION})"
            echo ""
            echo '```'
            python -m coverage report || true
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}

  build:
    name: Build distributables
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38  # v5.4.0
        with:
          python-version-file: ".python-version"

      - name: Build
        run: |
          pip install build twine
          python -m build
          twine check dist/*

  # Integration tests cross a real boundary (§3.6). The template's tests start a
  # local HTTP server in-process, so they need nothing extra here. When the
  # project gains a database, add it as a service container, e.g.:
  #
  #   services:
  #     postgres:
  #       image: postgres:16
  #       env:
  #         POSTGRES_PASSWORD: test-only-not-a-real-credential
  #       ports: ["5432:5432"]
  #       options: >-
  #         --health-cmd pg_isready --health-interval 10s --health-retries 5
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38  # v5.4.0
        with:
          python-version-file: ".python-version"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Run integration tests
        run: make test-integration
