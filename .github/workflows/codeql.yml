# CodeQL code scanning (§3.9).
#
# GitHub's *default setup* (Settings → Code security → Code scanning) is
# sufficient for most repositories and needs no workflow file at all. Use this
# advanced setup only when you need a custom query suite, a non-default build,
# or a language default setup does not cover.
name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly, so newly published queries run against unchanged code.
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write   # Required to upload results. Job-scoped, not workflow-scoped.
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # Keep only the languages this repository actually contains.
        language: ["python"]
        # language: ["javascript-typescript"]
        # language: ["actions"]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3  # TODO(pin): replace with the full commit SHA — see templates/README.md
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3  # TODO(pin): replace with the full commit SHA

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3  # TODO(pin): replace with the full commit SHA
        with:
          category: "/language:${{ matrix.language }}"
