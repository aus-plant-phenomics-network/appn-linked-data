# Release automation (§3.10).
#
# Releases are cut from annotated, signed tags following semantic versioning:
#
#   git tag -s -a v1.4.0 -m "Release v1.4.0"
#   git push origin v1.4.0
#
# Auto-generated notes are a changelog, not release notes — this workflow
# creates the release as a DRAFT so a human edits it before publishing.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # Required to create the release. Job-scoped.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0   # Full history, so release notes can diff against the previous tag.

      - name: Verify the tag is annotated
        run: |
          if [[ "$(git cat-file -t "${TAG_NAME}")" != "tag" ]]; then
            echo "::error::${TAG_NAME} is a lightweight tag. Releases require an annotated tag (git tag -s -a)."
            exit 1
          fi
        env:
          # Never interpolate github.* directly into run: — pass via env (§3.11).
          TAG_NAME: ${{ github.ref_name }}

      # - name: Build distributables
      #   run: make build

      - name: Create draft release
        run: gh release create "${TAG_NAME}" --draft --generate-notes --verify-tag
        env:
          TAG_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publishing to a package registry belongs in a separate job gated on a
      # GitHub environment with required reviewers, using OIDC rather than a
      # long-lived token (§3.9).
